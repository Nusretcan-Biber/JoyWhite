stages:
  - dockerize
  - restart

docker-build:
  only:
    refs:
      - master
  image: docker:latest
  stage: dockerize
  services:
    - name: docker:dind
  before_script:
    - docker login --username "$DOCKER_REGISTRY_USER" --password "$DOCKER_REGISTRY_PASSWORD"
  after_script:
    - docker logout
  script:
    #- echo $CI_COMMIT_SHORT_SHA
    - docker build . --tag $DOCKER_REGISTRY_USER/$APP_TAG:dev
    - docker tag $DOCKER_REGISTRY_USER/$APP_TAG:dev $DOCKER_REGISTRY_USER/$APP_TAG:stable
    - docker push $DOCKER_REGISTRY_USER/$APP_TAG:dev
    - docker push $DOCKER_REGISTRY_USER/$APP_TAG:stable

deploy_staging:
  stage: restart
  before_script:
    - apt-get update
    - apt-get install sshpass
